name: ESDK TestServer (C)

on:
  pull_request:
    paths:
      - 'test-server/**'
      - 'CMakeLists.txt'
      - '.github/workflows/test-server.yml'
  push:
    branches:
      - master
    paths:
      - 'test-server/**'
      - 'CMakeLists.txt'
      - '.github/workflows/test-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout aws-c-common
        uses: actions/checkout@v4
        with:
          repository: awslabs/aws-c-common
          path: aws-c-common

      - name: Build and install aws-c-common
        run: |
          cmake -S aws-c-common -B build-aws-c-common -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DBUILD_TESTING=OFF
          cmake --build build-aws-c-common --target install -- -j

      - name: Install stub for the unpublished MPL test-vectors artifact
        # The java Language_Server build runs `mvn install`, which resolves a
        # test-scope MPL artifact (TestAwsCryptographicMaterialProviders) that is
        # not on Maven Central; a stub jar satisfies resolution (its tests skip).
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          echo placeholder > "$tmp/README.txt"
          "$JAVA_HOME/bin/jar" cf "$tmp/stub.jar" -C "$tmp" README.txt
          mvn -q -e org.apache.maven.plugins:maven-install-plugin:3.1.1:install-file \
            -Dfile="$tmp/stub.jar" \
            -DgroupId=software.amazon.cryptography \
            -DartifactId=TestAwsCryptographicMaterialProviders \
            -Dversion=1.7.0 \
            -Dpackaging=jar
      - name: Build and test the test server
        run: make -C test-server test CMAKE_PREFIX_PATH=${{ github.workspace }}/install

  # The cross-language TestServer run, from the shared commons workflow. This
  # checkout supplies the c server and library; every other server comes from
  # its configured branch. Only the pairs involving c run; the full matrix
  # runs in commons. repo-pat reads the private aws-crypto-tools-rust clones.
  test-server:
    name: TestServer
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: aws/aws-crypto-tools-commons/.github/workflows/esdk-test-server-reusable.yml@main
    with:
      focus: c
      checkout-languages: c
      runner: ubuntu-latest
    secrets:
      repo-pat: ${{ secrets.COMMONS_REPO_PAT }}
