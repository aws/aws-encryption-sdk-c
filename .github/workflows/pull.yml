name: Pull Request Workflow

on:
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  clang-format:
    uses: ./.github/workflows/clang-format.yml
    secrets: inherit
  codebuild:
    uses: ./.github/workflows/codebuild.yml
    secrets: inherit
  osx:
    uses: ./.github/workflows/osx.yml
    with:
      platforms: >-
        [{"os": "ubuntu-22.04", "runner": "codebuild-CryptoToolsCI-linux-aws-encryption-sdk-c-${{ github.run_id }}-${{ github.run_attempt }}", "openssl_version": "openssl@1.1"}]
    secrets: inherit
  osx-macos:
    name: osx (macOS)
    uses: ./.github/workflows/osx.yml
    with:
      platforms: >-
        [{"os": "macos-latest-large", "runner": "macos-latest-large", "openssl_version": "openssl@3"}]
    secrets: inherit
  proof-ci:
    uses: ./.github/workflows/proof_ci.yml
    secrets: inherit
  pr-ci-all-required:
    if: always()
    needs:
      - clang-format
      - codebuild
      - osx
      - proof-ci
    runs-on: codebuild-CryptoToolsCI-linux-aws-encryption-sdk-c-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify all required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}